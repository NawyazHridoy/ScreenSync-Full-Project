name: Build ScreenSync APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies and Sync Capacitor
        run: |
          npm install || true
          mkdir -p www
          if [ -f "ScreenSync.html" ] && [ ! -f "www/index.html" ]; then
            cp "ScreenSync.html" www/index.html
          fi
          if [ ! -f "capacitor.config.json" ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "ScreenSync" "com.hridoy.screensync" --web-dir www
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android || true
          fi

      - name: Build Debug APK and Signed Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias screensync-key -storepass 123456 -keypass 123456 -dname "CN=ScreenSync, OU=Dev, O=App, L=Dhaka, S=Dhaka, C=BD"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release-key.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=screensync-key \
            -Pandroid.injected.signing.key.password=123456

      - name: Upload APK, AAB and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSync-Android-Files
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/release-key.jks